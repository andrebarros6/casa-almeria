name: Daily scrape (cloud sources)

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Madrid in winter, 08:00 in summer
  workflow_dispatch:
    inputs:
      max_details:
        description: "Max detail pages per source (blank = default 300)"
        required: false

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      COMMUTE_ADDRESS: ${{ secrets.COMMUTE_ADDRESS }}      # kept out of the public repo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # optional: daily digest
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      ALERTS_EMAIL: ${{ secrets.ALERTS_EMAIL }}            # optional: dedicated Gmail for portal alerts
      ALERTS_APP_PASSWORD: ${{ secrets.ALERTS_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Check secrets are configured
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_SERVICE_KEY in repo Settings > Secrets > Actions"
            exit 1
          fi
      - name: Scrape
        env:
          MAX_DETAILS: ${{ inputs.max_details }}
        run: |
          ARGS=(--sources cloud)
          if [ -n "$MAX_DETAILS" ]; then
            [[ "$MAX_DETAILS" =~ ^[0-9]+$ ]] || { echo "::error::max_details must be a number"; exit 1; }
            ARGS+=(--max-details "$MAX_DETAILS")
          fi
          python -m scraper.run "${ARGS[@]}"
